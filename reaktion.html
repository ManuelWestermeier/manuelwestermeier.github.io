<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaktionszeit-Test (Links / Rechts)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #1e1e24;
      color: #ffffff;
      user-select: none;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #aaa;
      margin-top: 0;
    }

    .game-container {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }

    .box {
      width: 180px;
      height: 220px;
      background-color: #2b2d42;
      border: 3px solid #4a4e69;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.1s, transform 0.05s;
    }

    .box:active {
      transform: scale(0.98);
    }

    /* Status-Farben */
    .box.active {
      background-color: #00b4d8;
      border-color: #90e0ef;
      box-shadow: 0 0 20px #00b4d8;
    }

    .box.correct {
      background-color: #2b9348;
      border-color: #55a630;
    }

    .box.wrong {
      background-color: #d90429;
      border-color: #ef233c;
    }

    #info-text {
      font-size: 1.2rem;
      height: 30px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .controls {
      margin-top: 15px;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #7209b7;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #5f0f40;
    }
  </style>
</head>
<body>

  <h1>Reaktions-Test</h1>
  <p>Nutze die Buttons oder die Pfeiltasten (← / →)</p>

  <div id="info-text">Klicke "Start", um zu beginnen</div>

  <div class="game-container">
    <div id="left-box" class="box" onclick="handleInput('left')">LINKS (←)</div>
    <div id="right-box" class="box" onclick="handleInput('right')">RECHTS (→)</div>
  </div>

  <div class="controls">
    <button id="start-btn" onclick="startGame()">Start</button>
  </div>

  <script>
    let timer = null;
    let startTime = 0;
    let activeSide = null; // 'left' oder 'right'
    let isWaiting = false;
    let isGameRunning = false;

    const infoText = document.getElementById('info-text');
    const leftBox = document.getElementById('left-box');
    const rightBox = document.getElementById('right-box');
    const startBtn = document.getElementById('start-btn');

    function resetBoxes() {
      leftBox.className = 'box';
      rightBox.className = 'box';
    }

    function startGame() {
      resetBoxes();
      infoText.innerText = "Achtung...";
      infoText.style.color = "#ffffff";
      isGameRunning = true;
      isWaiting = true;
      activeSide = null;
      startBtn.disabled = true;

      // Zufällige Zeit zwischen 1.5 und 4 Sekunden
      const randomDelay = Math.floor(Math.random() * 2500) + 1500;

      clearTimeout(timer);
      timer = setTimeout(showTarget, randomDelay);
    }

    function showTarget() {
      if (!isGameRunning) return;
      
      isWaiting = false;
      activeSide = Math.random() < 0.5 ? 'left' : 'right';

      if (activeSide === 'left') {
        leftBox.classList.add('active');
      } else {
        rightBox.classList.add('active');
      }

      startTime = Date.now();
    }

    function handleInput(side) {
      if (!isGameRunning) return;

      // Frühstart abgefangen
      if (isWaiting) {
        clearTimeout(timer);
        infoText.innerText = "Zu früh geklickt! ❌";
        infoText.style.color = "#d90429";
        endGame();
        return;
      }

      const reactionTime = Date.now() - startTime;

      if (side === activeSide) {
        // Richtig gedrückt
        document.getElementById(`${side}-box`).className = 'box correct';
        infoText.innerText = `Super! Zeit: ${reactionTime} ms ⚡`;
        infoText.style.color = "#2b9348";
      } else {
        // Falsche Seite gedrückt
        document.getElementById(`${side}-box`).className = 'box wrong';
        infoText.innerText = "Falsche Seite! ❌";
        infoText.style.color = "#d90429";
      }

      endGame();
    }

    function endGame() {
      isGameRunning = false;
      isWaiting = false;
      startBtn.disabled = false;
      startBtn.innerText = "Nochmal spielen";
    }

    // Tastatur-Steuerung hinzufügen (Pfeiltasten Links/Rechts)
    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') {
        handleInput('left');
      } else if (event.key === 'ArrowRight') {
        handleInput('right');
      } else if (event.key === ' ' && !isGameRunning) {
        // Leerzeichen zum Starten
        startGame();
      }
    });
  </script>

</body>
</html>
